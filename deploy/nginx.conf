# Example Nginx site for Strivera Global on AWS EC2.
# Copy to /etc/nginx/sites-available/strivera and symlink into sites-enabled.
# Then run certbot for HTTPS:
#   sudo certbot --nginx -d striveraglobal.co.uk -d www.striveraglobal.co.uk

server {
    listen 80;
    listen [::]:80;
    server_name striveraglobal.co.uk www.striveraglobal.co.uk;

    root /var/www/strivera/dist;
    index index.html;

    # Security headers for the static site
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Hashed build assets can be cached for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Form API -> Node/Express server (server/ folder) on port 5001
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    # Single-page app: send unknown paths to index.html so React Router can handle them
    location / {
        try_files $uri $uri/ /index.html;
    }
}
